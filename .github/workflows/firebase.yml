name: firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  checks: write
  contents: read

concurrency:
  group: firebase
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: secret do Firebase
        id: conta
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "presente=0" >> "$GITHUB_OUTPUT"
            echo "::warning::FIREBASE_SERVICE_ACCOUNT ausente. O deploy no Firebase Hosting foi pulado."
          else
            echo "presente=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.conta.outputs.presente == '1'
      - uses: pnpm/action-setup@v4
        if: steps.conta.outputs.presente == '1'
        with:
          version: 10.33.3
      - uses: actions/setup-node@v4
        if: steps.conta.outputs.presente == '1'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.conta.outputs.presente == '1'
        run: pnpm install --frozen-lockfile
      - name: build das telas
        if: steps.conta.outputs.presente == '1'
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm build
      - name: publicar no Hosting
        if: steps.conta.outputs.presente == '1'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          target: app
