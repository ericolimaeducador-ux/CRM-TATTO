name: nuvem

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuvem
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: conferir autenticação do Google
        id: conta
        env:
          WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          SA: ${{ vars.GCP_SERVICE_ACCOUNT }}
          CHAVE: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -n "$WIF" ] && [ -n "$SA" ]; then
            echo "modo=wif" >> "$GITHUB_OUTPUT"
          elif [ -n "$CHAVE" ]; then
            echo "modo=chave" >> "$GITHUB_OUTPUT"
          else
            echo "modo=pular" >> "$GITHUB_OUTPUT"
            echo "::warning::Sem Workload Identity Federation (variáveis GCP_WORKLOAD_IDENTITY_PROVIDER e GCP_SERVICE_ACCOUNT) e sem o secret GCP_SA_KEY. O deploy no Cloud Run e no Firebase Hosting foi pulado."
          fi

      - uses: actions/checkout@v4
        if: steps.conta.outputs.modo != 'pular'

      - uses: google-github-actions/auth@v2
        if: steps.conta.outputs.modo == 'wif'
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/auth@v2
        if: steps.conta.outputs.modo == 'chave'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.conta.outputs.modo != 'pular'

      - name: projeto
        id: projeto
        if: steps.conta.outputs.modo != 'pular'
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          PROJETO="$GCP_PROJECT_ID"
          if [ -z "$PROJETO" ]; then
            PROJETO="$(node -pe "require('./.firebaserc').projects.default")"
          fi
          if [ -z "$PROJETO" ] || [ "$PROJETO" = "captura7-substitua-o-id" ]; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Defina a variável GCP_PROJECT_ID ou troque o placeholder captura7-substitua-o-id em .firebaserc. O deploy foi pulado."
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "id=$PROJETO" >> "$GITHUB_OUTPUT"
            gcloud config set project "$PROJETO"
          fi

      - name: imagem e Cloud Run
        if: steps.projeto.outputs.ok == '1'
        env:
          PROJETO: ${{ steps.projeto.outputs.id }}
          CONTROLADOR_EMAIL: ${{ vars.CONTROLADOR_EMAIL }}
          CORS_ORIGENS: ${{ vars.CORS_ORIGENS }}
        run: |
          set -eu
          REGIAO=southamerica-east1
          IMAGEM="${REGIAO}-docker.pkg.dev/${PROJETO}/captura7/api:${GITHUB_SHA}"
          if ! gcloud artifacts repositories describe captura7 --location="$REGIAO" --project="$PROJETO" >/dev/null 2>&1; then
            gcloud artifacts repositories create captura7 \
              --repository-format=docker \
              --location="$REGIAO" \
              --project="$PROJETO" \
              --description="Imagem da API do captura7"
          fi
          gcloud auth configure-docker "${REGIAO}-docker.pkg.dev" --quiet
          docker build -f apps/api/Dockerfile -t "$IMAGEM" .
          docker push "$IMAGEM"
          VARS="NODE_ENV=production|CAPTURA7_TRUST_PROXY_SALTOS=1|RETENCAO_MESES=24|PURGA_REVOGACAO_DIAS=30|RASCUNHO_DIAS=180|RETENCAO_TIMER=0"
          if [ -n "$CONTROLADOR_EMAIL" ]; then
            VARS="${VARS}|CONTROLADOR_EMAIL=${CONTROLADOR_EMAIL}"
          fi
          if [ -n "$CORS_ORIGENS" ]; then
            VARS="${VARS}|CORS_ORIGENS=${CORS_ORIGENS}"
          fi
          gcloud run deploy captura7-api \
            --project="$PROJETO" \
            --image="$IMAGEM" \
            --region="$REGIAO" \
            --platform=managed \
            --port=8080 \
            --min-instances=0 \
            --max-instances=2 \
            --memory=512Mi \
            --cpu=1 \
            --ingress=all \
            --allow-unauthenticated \
            --set-secrets="MONGO_URI=MONGO_URI:latest,CIFRA_CHAVE_BASE64=CIFRA_CHAVE_BASE64:latest,CIFRA_PEPPER=CIFRA_PEPPER:latest,RETENCAO_TOKEN=RETENCAO_TOKEN:latest" \
            --set-env-vars="^|^${VARS}" \
            --quiet

      - uses: pnpm/action-setup@v4
        if: steps.projeto.outputs.ok == '1'
        with:
          version: 10.33.3

      - uses: actions/setup-node@v4
        if: steps.projeto.outputs.ok == '1'
        with:
          node-version: 22
          cache: pnpm

      - if: steps.projeto.outputs.ok == '1'
        run: pnpm install --frozen-lockfile

      - name: build das telas
        if: steps.projeto.outputs.ok == '1'
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: pnpm build

      - name: publicar no Hosting
        if: steps.projeto.outputs.ok == '1'
        env:
          PROJETO: ${{ steps.projeto.outputs.id }}
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project "$PROJETO" --non-interactive
