services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      CAPTURA7_TRUST_PROXY_SALTOS: '1'
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/captura7}
      PORT: '3000'
      SEGREDOS_ARQUIVO: /segredos/captura7.env
      QR_TOKEN_MAX_USOS: ${QR_TOKEN_MAX_USOS:-1}
      QR_TOKEN_TTL_SEGUNDOS: ${QR_TOKEN_TTL_SEGUNDOS:-7200}
      CAPTCHA_PROVEDOR: ${CAPTCHA_PROVEDOR:-local}
      RETENCAO_MESES: ${RETENCAO_MESES:-24}
      PURGA_REVOGACAO_DIAS: ${PURGA_REVOGACAO_DIAS:-30}
      RASCUNHO_DIAS: ${RASCUNHO_DIAS:-180}
      CORS_ORIGENS: ${CORS_ORIGENS:-}
      CONTROLADOR_EMAIL: ${CONTROLADOR_EMAIL:-}
      ERP_WEBHOOK_URL: ${ERP_WEBHOOK_URL:-}
      ERP_WEBHOOK_SEGREDO: ${ERP_WEBHOOK_SEGREDO:-}
      HCAPTCHA_SEGREDO: ${HCAPTCHA_SEGREDO:-}
      HCAPTCHA_SITEKEY: ${HCAPTCHA_SITEKEY:-}
      TURNSTILE_SEGREDO: ${TURNSTILE_SEGREDO:-}
      WHATSAPP_ENVIO_ATIVO: ${WHATSAPP_ENVIO_ATIVO:-false}
      WHATSAPP_API_VERSAO: ${WHATSAPP_API_VERSAO:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_TEMPLATE_BOAS_VINDAS: ${WHATSAPP_TEMPLATE_BOAS_VINDAS:-}
      WHATSAPP_TEMPLATE_IDIOMA: ${WHATSAPP_TEMPLATE_IDIOMA:-pt_BR}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      TURNSTILE_SITEKEY: ${TURNSTILE_SITEKEY:-}
    volumes:
      - segredos:/segredos
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/v1/saude').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    environment:
      CERT_DIR: /certs
      CERT_IPS: ${CERT_IPS:-}
    volumes:
      - certs:/certs
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'

volumes:
  mongo-data:
  segredos:
  certs:
