services:
  - type: web
    name: captura7-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@10.33.3 --activate && pnpm install --frozen-lockfile && pnpm --filter @captura7/api build
    startCommand: pnpm --filter @captura7/api start
    healthCheckPath: /v1/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: CAPTURA7_TRUST_PROXY_SALTOS
        value: '1'
      - key: RETENCAO_MESES
        value: '24'
      - key: PURGA_REVOGACAO_DIAS
        value: '30'
      - key: RASCUNHO_DIAS
        value: '180'
      - key: MONGO_URI
        sync: false
      - key: CIFRA_CHAVE_BASE64
        sync: false
      - key: CIFRA_PEPPER
        sync: false
      - key: CONTROLADOR_EMAIL
        sync: false
      - key: CORS_ORIGENS
        sync: false
