services:
  - type: web
    name: captura7-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npx -y pnpm@10.33.3 install --frozen-lockfile && npx -y pnpm@10.33.3 --filter @captura7/api build
    startCommand: cd apps/api && node dist/main.js
    healthCheckPath: /v1/saude
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '22'
      - key: CAPTURA7_TRUST_PROXY_SALTOS
        value: '1'
      - key: RETENCAO_MESES
        value: '24'
      - key: PURGA_REVOGACAO_DIAS
        value: '30'
      - key: RASCUNHO_DIAS
        value: '180'
      - key: MONGO_URI
        sync: false
      - key: CIFRA_CHAVE_BASE64
        sync: false
      - key: CIFRA_PEPPER
        sync: false
      - key: CONTROLADOR_EMAIL
        sync: false
      # Duas origens do Firebase, separadas por vírgula, sem barra no fim:
      # https://captura7-5e1da.web.app,https://captura7-5e1da.firebaseapp.com,https://tattooart.web.app,https://tattooart.firebaseapp.com
      - key: CORS_ORIGENS
        sync: false
      # Token do POST /v1/interno/retencao. O workflow retencao usa o mesmo valor.
      - key: RETENCAO_TOKEN
        sync: false
